[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "odgs-maturity"
version = "1.0.1"
description = "ODGS Governance Maturity Assessment — Diagnostic scoring and charter generation for ODGS workspaces"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Metric Provenance", email = "partner@metricprovenance.com"}]
keywords = [
    "data-governance", "maturity-assessment", "dama-dmbok",
    "data-quality", "compliance", "odgs", "charter-generation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
pdf = ["weasyprint>=60.0"]
all = ["odgs-maturity[pdf]"]

[project.scripts]
odgs-maturity = "odgs_maturity.cli:app"

[project.urls]
Homepage = "https://metricprovenance.com"
Repository = "https://github.com/MetricProvenance/odgs-maturity"
Documentation = "https://github.com/MetricProvenance/odgs-maturity/tree/main/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/odgs_maturity"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".pytest_cache/",
    "tests/.pytest_cache/",
    "**/*.log",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
